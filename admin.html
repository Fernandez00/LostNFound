<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Lost & Found Items</title>
    <link rel="icon" type="image/png" href="/LNF.jpg">
    <style>
        :root {
            --primary: #4834d4;
            --primary-dark: #3525b0;
            --surface: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --danger: #e92727;
            --warning: #f39c12;
            --success: #2ecc71;
            --info: #3498db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            background-color: #f8f9fa;
            color: var(--text);
        }

        header {
            background-color: var(--primary);
            padding: 1.5rem 2rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .logout-btn,
        .analytics-btn {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            color: #4834d4;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background-color: var(--surface);
            border: 1px solid var(--surface);
        }

        .logout-btn:hover,
        .analytics-btn:hover {
            background-color: var(--primary-dark);
            color: white;
        }

        .search-container {
            max-width: 1200px;
            margin: 1rem auto 0;
            padding: 0 1rem;
        }

        .search-bar {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .search-suggestions {
            position: absolute;
            width: calc(100% - 2rem);
            max-width: 1200px;
            background: white;
            border: 1px solid #eee;
            border-radius: 0 0 8px 8px;
            box-shadow: var(--shadow);
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .suggestion-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background-color: #f8f9fa;
        }

        main {
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            height: fit-content;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title span {
            font-size: 0.875rem;
            font-weight: normal;
            color: var(--text-light);
        }

        .newsfeed {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .newsfeed-item {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1.5rem;
            position: relative;
            cursor: pointer;
        }

        .newsfeed-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .newsfeed-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .newsfeed-type {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .type-lost {
            background-color: #ffeaa7;
            color: #d35400;
        }

        .type-found {
            background-color: #55efc4;
            color: #006266;
        }

        .newsfeed-image-container {
            width: 100%;
            height: 180px;
            background-color: #f5f6fa;
            border-radius: 8px;
            margin: 0.75rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .newsfeed-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: pointer;
        }

        .no-image {
            color: var(--text-light);
            font-style: italic;
        }

        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background-color 0.3s;
            opacity: 0;
            visibility: hidden;
        }

        .newsfeed-image-container:hover .nav-button {
            opacity: 1;
            visibility: visible;
        }

        .nav-button:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }

        .nav-button.prev {
            left: 10px;
        }

        .nav-button.next {
            right: 10px;
        }

        .image-counter {
            position: absolute;
            bottom: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            opacity: 0;
            visibility: hidden;
        }

        .newsfeed-image-container:hover .image-counter {
            opacity: 1;
            visibility: visible;
        }

        .newsfeed-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0.5rem 0;
            color: var(--text);
        }

        .newsfeed-details {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .newsfeed-location {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .newsfeed-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        .status-claimed {
            background-color: #55efc4;
            color: #006266;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }

        /* Admin Controls */
        .admin-controls {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 0.5rem;
        }

        .admin-btn {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .edit-btn {
            background-color: var(--warning);
            color: white;
        }

        .delete-btn {
            background-color: var(--danger);
            color: white;
        }

        .claim-btn {
            background-color: var(--success);
            color: white;
        }

        .admin-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            padding: 2rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            background: none;
            border: none;
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .modal-images-container {
            position: relative;
            width: 100%;
            max-height: 200px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f6fa;
            border-radius: 8px;
            padding: 5px;
            overflow: hidden;
        }

        .modal-image {
            max-width: 100%;
            max-height: 190px;
            object-fit: contain;
            border-radius: 8px;
        }

        .modal-nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background-color 0.3s;
            opacity: 0;
            visibility: hidden;
        }

        .modal-images-container:hover .modal-nav-button {
            opacity: 1;
            visibility: visible;
        }

        .modal-nav-button:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-nav-button.prev {
            left: 10px;
        }

        .modal-nav-button.next {
            right: 10px;
        }

        .modal-image-counter {
            position: absolute;
            bottom: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            opacity: 0;
            visibility: hidden;
        }

        .modal-images-container:hover .modal-image-counter {
            opacity: 1;
            visibility: visible;
        }

        .modal-details {
            margin-bottom: 1rem;
        }

        .modal-details div {
            margin-bottom: 0.5rem;
        }

        .modal-details strong {
            display: inline-block;
            width: 80px;
            font-weight: 500;
        }

        .contact-info {
            margin-top: 1.5rem;
        }

        .contact-info h4 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .contact-item {
            display: flex;
            margin-bottom: 0.75rem;
        }

        .contact-label {
            font-weight: 500;
            min-width: 80px;
            color: var(--text);
        }

        .contact-value {
            color: var(--text-light);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            flex: 1;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-secondary {
            background-color: #eee;
            color: var(--text);
        }

        /* Edit Modal Styles */
        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .edit-modal-content {
            background-color: white;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            overflow-y: auto;
        }

        .edit-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .edit-modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }

        .edit-modal-close {
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
        }

        .edit-form-group {
            margin-bottom: 1.25rem;
        }

        .edit-form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        .edit-form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .edit-form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .edit-form-btn {
            padding: 0.75rem 1.25rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .edit-form-cancel {
            background-color: #eee;
            border: none;
            color: #333;
        }

        .edit-form-submit {
            background-color: var(--primary);
            color: white;
            border: none;
        }

        .edit-form-submit:hover {
            background-color: var(--primary-dark);
        }

        /* Image upload styles */
        .image-upload-container {
            border: 1px dashed #ccc;
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1rem;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .image-upload-container:hover {
            border-color: var(--primary);
        }

        .image-preview-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 10px;
            width: 100%;
            padding: 5px;
        }

        .image-preview-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .image-preview {
            max-width: 100px;
            max-height: 100px;
            border-radius: 4px;
            object-fit: contain;
        }

        .remove-image-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }

        .upload-progress {
            margin-top: 0.5rem;
            height: 4px;
            width: 100%;
            background-color: #eee;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        .upload-image-btn {
            padding: 0.5rem 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            transition: background-color 0.2s;
        }

        .upload-image-btn:hover {
            background-color: var(--primary-dark);
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }

            .header-title {
                font-size: 1.5rem;
            }

            .card {
                padding: 1.25rem;
            }

            .modal-content,
            .edit-modal-content {
                width: 95%;
                padding: 1rem;
            }

            .modal-image {
                max-height: 160px;
            }

            .modal-nav-button {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
        }

        #editItemForm {
            padding-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="header-title">ADMIN - LOST & FOUND</h1>
        <div class="header-actions">
            <button class="analytics-btn" onclick="window.location.href='analytics.html'">Analytics</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="search-container">
        <input type="text" class="search-bar" id="searchInput" placeholder="Search items by name..." autocomplete="off">
        <div class="search-suggestions" id="searchSuggestions"></div>
    </div>

    <main>
        <section class="card">
            <h2 class="card-title">Lost Items <span id="lostCount">0 items</span></h2>
            <div class="newsfeed" id="lostItemsFeed">
                <div class="empty-state">Loading lost items...</div>
            </div>
        </section>

        <section class="card">
            <h2 class="card-title">Found Items <span id="foundCount">0 items</span></h2>
            <div class="newsfeed" id="foundItemsFeed">
                <div class="empty-state">Loading found items...</div>
            </div>
        </section>
    </main>

    <!-- Item Details Modal -->
    <div class="modal" id="itemModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h3 class="modal-title" id="modalItemTitle">Item Details</h3>
            <div class="modal-images-container" id="modalImagesContainer"></div>
            <div class="modal-details" id="modalItemDetails"></div>
            <div class="contact-info">
                <h4>Contact Information</h4>
                <div class="contact-item">
                    <span class="contact-label">Name:</span>
                    <span class="contact-value" id="contactName"></span>
                </div>
                <div class="contact-item">
                    <span class="contact-label">Phone:</span>
                    <span class="contact-value" id="contactPhone"></span>
                </div>
                <div class="contact-item">
                    <span class="contact-label">Email:</span>
                    <span class="contact-value" id="contactEmail"></span>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="editItemBtn" onclick="openEditModal(currentItem)">Edit</button>
                <button class="btn btn-primary" id="claimItemBtn" style="background-color: var(--success);">Mark as Claimed</button>
                <button class="btn btn-primary" id="deleteItemBtn" style="background-color: var(--danger);">Delete</button>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal -->
    <div class="edit-modal" id="editModal">
        <div class="edit-modal-content">
            <div class="edit-modal-header">
                <h3 class="edit-modal-title">Edit Item</h3>
                <button class="edit-modal-close" onclick="closeEditModal()">×</button>
            </div>
            <form id="editItemForm">
                <div class="edit-form-group">
                    <label class="edit-form-label">Item Name</label>
                    <input type="text" class="edit-form-input" id="editItemName" required>
                </div>
                <div class="edit-form-group">
                    <label class="edit-form-label">Category</label>
                    <input type="text" class="edit-form-input" id="editCategory" required>
                </div>
                <div class="edit-form-group">
                    <label class="edit-form-label">Color</label>
                    <input type="text" class="edit-form-input" id="editColor" required>
                </div>
                <div class="edit-form-group">
                    <label class="edit-form-label">Location</label>
                    <input type="text" class="edit-form-input" id="editLocation" required>
                </div>
                <div class="edit-form-group">
                    <label class="edit-form-label">Date</label>
                    <input type="date" class="edit-form-input" id="editDate" required>
                </div>
                <div class="edit-form-group">
                    <label class="edit-form-label">Images</label>
                    <div class="image-upload-container" id="imageUploadContainer">
                        <div class="image-preview-container" id="imagePreviewContainer"></div>
                        <p id="uploadText">Click the button to upload images (multiple allowed)</p>
                        <button type="button" class="upload-image-btn" id="uploadImageBtn">Upload Image</button>
                        <input type="file" id="imageFileInput" style="display: none" accept="image/*" multiple>
                        <div class="upload-progress" id="uploadProgress">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>
                    <input type="hidden" id="editImageUrls">
                </div>
                <div class="edit-form-group">
                    <label class="edit-form-label">Contact Name</label>
                    <input type="text" class="edit-form-input" id="editContactName" required>
                </div>
                <div class="edit-form-group">
                    <label class="edit-form-label">Contact Phone</label>
                    <input type="text" class="edit-form-input" id="editContactPhone" required>
                </div>
                <div class="edit-form-group">
                    <label class="edit-form-label">Contact Email</label>
                    <input type="email" class="edit-form-input" id="editContactEmail" required>
                </div>
                <div class="edit-form-actions">
                    <button type="button" class="edit-form-btn edit-form-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="edit-form-btn edit-form-submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove, update, push, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOZZ44tcqI8TPCXK6SzT7tURKM01j7efo",
            authDomain: "lostnfounditemlostdb.firebaseapp.com",
            databaseURL: "https://lostnfounditemlostdb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lostnfounditemlostdb",
            storageBucket: "lostnfounditemlostdb.appspot.com",
            messagingSenderId: "494153480103",
            appId: "1:494153480103:web:e04aef1eab4e89cdb5a882"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // Global variables
        let allItems = [];

        function formatDate(dateString) {
            if (!dateString) return 'Unknown date';
            try {
                const options = { year: 'numeric', month: 'short', day: 'numeric' };
                return new Date(dateString).toLocaleDateString(undefined, options);
            } catch (e) {
                return 'Unknown date';
            }
        }

        // Function to validate and convert image URLs to an array
        function validateImageUrls(imageUrls) {
            if (!Array.isArray(imageUrls)) {
                return imageUrls ? [imageUrls] : [];
            }
            return imageUrls.filter(url => typeof url === 'string' && url.trim() !== '');
        }

        // Function to navigate images in the newsfeed
        function navigateImage(itemId, direction) {
            const container = document.getElementById(`image-container-${itemId}`);
            let currentIndex = parseInt(container.dataset.currentIndex, 10);
            const rawImageUrls = JSON.parse(container.dataset.imageUrls);
            const imageUrls = validateImageUrls(rawImageUrls);

            if (direction === 'next') {
                currentIndex = (currentIndex + 1) % imageUrls.length;
            } else if (direction === 'prev') {
                currentIndex = (currentIndex - 1 + imageUrls.length) % imageUrls.length;
            }

            container.dataset.currentIndex = currentIndex;
            const imgElement = container.querySelector('.newsfeed-image');
            imgElement.src = imageUrls[currentIndex];
            imgElement.alt = `Item Image ${currentIndex + 1}`;

            const counter = container.querySelector('.image-counter');
            counter.textContent = `${currentIndex + 1}/${imageUrls.length}`;
        }

        // Function to navigate images in modal
        function navigateModalImage(direction) {
            const container = document.getElementById('modalImagesContainer');
            let currentIndex = parseInt(container.dataset.currentIndex, 10);
            const rawImageUrls = JSON.parse(container.dataset.imageUrls);
            const imageUrls = validateImageUrls(rawImageUrls);
            
            if (direction === 'next') {
                currentIndex = (currentIndex + 1) % imageUrls.length;
            } else if (direction === 'prev') {
                currentIndex = (currentIndex - 1 + imageUrls.length) % imageUrls.length;
            }
            
            container.dataset.currentIndex = currentIndex;
            const imgElement = container.querySelector('.modal-image');
            imgElement.src = imageUrls[currentIndex];

                    removeBtn.className = 'remove-image-btn';

        // Function to upload multiple images
        async function uploadImages(files) {
            const uploadProgress = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('progressBar');
            uploadProgress.style.display = 'block';
            
            try {
                const newUrls = [];
                for (const file of files) {
                    // Reset progress for each file
                    progressBar.style.width = '0%';
                    
                    // Simulate progress
                    let progress = 0;
                    const progressInterval = setInterval(() => {
                        progress += 5;
                        if (progress > 90) clearInterval(progressInterval);
                        progressBar.style.width = `${progress}%`;
                    }, 100);
                    
                    try {
                        // Try ImgBB first
                        const url = await uploadToImgBB(file);
                        if (url) {
                            newUrls.push(url);
                            progressBar.style.width = '100%';
                            clearInterval(progressInterval);
                        }
                    } catch (error) {
                        console.error('ImgBB upload failed for:', file.name, error);
                        // Fallback to Firebase Storage
                        const fbUrl = await uploadToFirebaseStorage(file);
                        if (fbUrl) {
                            newUrls.push(fbUrl);
                            progressBar.style.width = '100%';
                            clearInterval(progressInterval);
                        }
                    }
                }
                
                uploadedImageUrls = [...uploadedImageUrls, ...newUrls];
                updateImagePreviews();
            } catch (error) {
                console.error('Error uploading images:', error);
                alert('Failed to upload some images. Please try again.');
            } finally {
                uploadProgress.style.display = 'none';
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // Function to upload image to ImgBB
        async function uploadToImgBB(file) {
            const apiKey = '9b0dc76f6c3bb19d9effe36ecdc9ed87';
            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('Failed to upload image to ImgBB');
                }
                
                const data = await response.json();
                if (data.data && data.data.url) {
                    return data.data.url;
                }
                throw new Error('No URL returned from ImgBB');
            } catch (error) {
                console.error('Error uploading to ImgBB:', error);
                throw error;
            }
        }

        // Function to upload image to Firebase Storage (fallback)
        async function uploadToFirebaseStorage(file) {
            try {
                const timestamp = new Date().getTime();
                const fileName = `item_images/${timestamp}_${file.name}`;
                const fileRef = storageRef(storage, fileName);
                const snapshot = await uploadBytes(fileRef, file);
                const downloadURL = await getDownloadURL(fileRef);
                return downloadURL;
            } catch (error) {
                console.error('Error uploading to Firebase Storage:', error);
                throw error;
            }
        }

        // Function to load all items
        function loadAllItems() {
            const lostItemsRef = ref(db, 'lostItems');
            const foundItemsRef = ref(db, 'foundItems');

            // Clear itemsMap before loading new data
            window.itemsMap.clear();

            onValue(lostItemsRef, (lostSnapshot) => {
                onValue(foundItemsRef, (foundSnapshot) => {
                    allItems = [];
                    const lostItems = [];
                    const foundItems = [];
                    
                    // Process lost items
                    if (lostSnapshot.exists()) {
                        lostSnapshot.forEach((childSnapshot) => {
                            const item = childSnapshot.val();
                            item.id = childSnapshot.key;
                            item.type = 'lost';
                            lostItems.push(item);
                            allItems.push(item);
                        });
                    }
                    
                    // Process found items
                    if (foundSnapshot.exists()) {
                        foundSnapshot.forEach((childSnapshot) => {
                            const item = childSnapshot.val();
                            item.id = childSnapshot.key;
                            item.type = 'found';
                            foundItems.push(item);
                            allItems.push(item);
                        });
                    }
                    
                    // Sort by timestamp (newest first)
                    lostItems.sort((a, b) => new Date(b.timestamp || b.dateLost || 0) - new Date(a.timestamp || a.dateLost || 0));
                    foundItems.sort((a, b) => new Date(b.timestamp || b.dateFound || 0) - new Date(a.timestamp || a.dateFound || 0));

                    // Render items
                    renderItems(lostItems, 'lostItemsFeed', 'lost');
                    renderItems(foundItems, 'foundItemsFeed', 'found');

                    // Build search suggestions
                    buildSearchSuggestions();
                });
            });
        }

        // Function to build search suggestions
        function buildSearchSuggestions() {
            searchSuggestions = [];
            const itemNames = new Set();
            
            allItems.forEach(item => {
                if (item.itemName) {
                    itemNames.add(item.itemName.toLowerCase());
                }
            });
            
            searchSuggestions = Array.from(itemNames);
        }

        // Function to show search suggestions
        function showSuggestions(searchTerm) {
            const suggestionsContainer = document.getElementById('searchSuggestions');
            
            if (!searchTerm || searchTerm.length < 2) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            
            const filtered = searchSuggestions.filter(suggestion => 
                suggestion.includes(searchTerm.toLowerCase())
            ).slice(0, 5);
            
            if (filtered.length === 0) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            
            let html = '';
            filtered.forEach(suggestion => {
                html += `<div class="suggestion-item">${suggestion}</div>`;
            });
            
            suggestionsContainer.innerHTML = html;
            suggestionsContainer.style.display = 'block';
        }

        // Function to filter items by search term
        function filterItems(searchTerm) {
            if (!searchTerm || searchTerm.length < 2) {
                loadAllItems();
                return;
            }
            
            const filteredLost = allItems.filter(item => 
                item.type === 'lost' && 
                item.itemName && 
                item.itemName.toLowerCase().includes(searchTerm.toLowerCase())
            );
            
            const filteredFound = allItems.filter(item => 
                item.type === 'found' && 
                item.itemName && 
                item.itemName.toLowerCase().includes(searchTerm.toLowerCase())
            );
            
            renderItems(filteredLost, 'lostItemsFeed', 'lost');
            renderItems(filteredFound, 'foundItemsFeed', 'found');
        }

            document.getElementById('uploadImageBtn').addEventListener('click', triggerFileInput);

            document.getElementById('itemModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('itemModal')) {
                    closeModal();
                }
            });

            document.getElementById('editModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('editModal')) {
                    closeEditModal();
                }
            });
        });

        // Make functions available globally
        window.showItemModal = showItemModal;
        window.openEditModal = openEditModal;
        window.closeModal = closeModal;
        window.closeEditModal = closeEditModal;
        window.handleDeleteItem = handleDeleteItem;
        window.handleClaimItem = handleClaimItem;
        window.triggerFileInput = triggerFileInput;
        window.navigateImage = navigateImage;
        window.navigateModalImage = navigateModalImage;
        window.logout = function() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
