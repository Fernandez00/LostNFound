<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Lost & Found Items</title>
    <link rel="icon" type="image/png" href="/LNF.jpg">
    <style>
        :root {
            --primary: #4834d4;
            --primary-dark: #3525b0;
            --surface: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --danger: #e92727;
            --warning: #f39c12;
            --success: #2ecc71;
            --info: #3498db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            background-color: #f8f9fa;
            color: var(--text);
        }

        header {
            background-color: var(--primary);
            padding: 1.5rem 2rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .logout-btn {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            color: #4834d4;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background-color: var(--surface);
            border: 1px solid var(--surface);
        }

        .analytics-btn {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            color: #4834d4;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background-color: var(--surface);
            border: 1px solid var(--surface);
        }

        .logout-btn:hover {
            background-color: var(--primary-dark);
            color: white;
        }

        .analytics-btn:hover {
            background-color: var(--primary-dark);
            color: white;
        }

        .search-container {
            max-width: 1200px;
            margin: 1rem auto 0;
            padding: 0 1rem;
        }

        .search-bar {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .search-suggestions {
            position: absolute;
            width: calc(100% - 2rem);
            max-width: 1200px;
            background: white;
            border: 1px solid #eee;
            border-radius: 0 0 8px 8px;
            box-shadow: var(--shadow);
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .suggestion-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background-color: #f8f9fa;
        }

        main {
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            height: fit-content;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title span {
            font-size: 0.875rem;
            font-weight: normal;
            color: var(--text-light);
        }

        .newsfeed {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .newsfeed-item {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1.5rem;
            position: relative;
        }

        .newsfeed-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .newsfeed-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .newsfeed-type {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .type-lost {
            background-color: #ffeaa7;
            color: #d35400;
        }

        .type-found {
            background-color: #55efc4;
            color: #006266;
        }

        .newsfeed-image-container {
            width: 100%;
            height: 180px;
            background-color: #f5f6fa;
            border-radius: 8px;
            margin: 0.75rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .newsfeed-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .no-image {
            color: var(--text-light);
            font-style: italic;
        }

        .newsfeed-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0.5rem 0;
            color: var(--text);
        }

        .newsfeed-details {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .newsfeed-location {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .newsfeed-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        .status-claimed {
            background-color: #55efc4;
            color: #006266;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }

        /* Admin Controls */
        .admin-controls {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 0.5rem;
        }

        .admin-btn {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .edit-btn {
            background-color: var(--warning);
            color: white;
        }

        .delete-btn {
            background-color: var(--danger);
            color: white;
        }

        .claim-btn {
            background-color: var(--success);
            color: white;
        }

        .admin-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            padding: 2rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow-y: auto; /* Add scrolling */
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            background: none;
            border: none;
            padding: 0.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .modal-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 1rem;
            cursor: pointer;
        }

        .contact-info {
            margin-top: 1.5rem;
        }

        .contact-item {
            display: flex;
            margin-bottom: 0.75rem;
        }

        .contact-label {
            font-weight: 500;
            min-width: 80px;
            color: var(--text);
        }

        .contact-value {
            color: var(--text-light);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-secondary {
            background-color: #eee;
            color: var(--text);
        }

        /* Image upload styles */
        .image-upload-container {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-upload-container:hover {
            border-color: var(--primary);
            background-color: #f8f9fa;
        }

        .image-preview {
            max-width: 100%;
            max-height: 120px;
            margin-top: 0.5rem;
            border-radius: 4px;
            object-fit: contain;
        }

        .upload-progress {
            margin-top: 0.5rem;
            height: 4px;
            width: 100%;
            background-color: #eee;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }

            .header-title {
                font-size: 1.5rem;
            }

            .card {
                padding: 1.25rem;
            }

            .modal-content {
                width: 95%;
                padding: 1.5rem;
            }
        }

        /* Add some padding at the bottom to ensure content isn't cut off */
        #editItemForm {
            padding-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="header-title">ADMIN - LOST & FOUND</h1>
        <div class="header-actions">
            <button class="analytics-btn" onclick="window.location.href='analytics.html'">Analytics</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="search-container">
        <input type="text" class="search-bar" id="searchInput" placeholder="Search items by name..." autocomplete="off">
        <div class="search-suggestions" id="searchSuggestions"></div>
    </div>

    <main>
        <section class="card">
            <h2 class="card-title">Lost Items <span id="lostCount">0 items</span></h2>
            <div class="newsfeed" id="lostItemsFeed">
                <div class="empty-state">Loading lost items...</div>
            </div>
        </section>

        <section class="card">
            <h2 class="card-title">Found Items <span id="foundCount">0 items</span></h2>
            <div class="newsfeed" id="foundItemsFeed">
                <div class="empty-state">Loading found items...</div>
            </div>
        </section>
    </main>

    <!-- Item Details Modal -->
    <div class="modal" id="itemModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 class="modal-title" id="modalItemTitle">Item Details</h3>
            <img id="modalItemImage" class="modal-image" src="/placeholder.svg" alt="Item Image" onclick="showEditModal(currentItem)">
            <div id="modalItemDetails"></div>
            <div class="contact-info">
                <h4>Contact Information</h4>
                <div class="contact-item">
                    <span class="contact-label">Name:</span>
                    <span class="contact-value" id="contactName"></span>
                </div>
                <div class="contact-item">
                    <span class="contact-label">Phone:</span>
                    <span class="contact-value" id="contactPhone"></span>
                </div>
                <div class="contact-item">
                    <span class="contact-label">Email:</span>
                    <span class="contact-value" id="contactEmail"></span>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="editItemBtn" onclick="showEditModal(currentItem)">Edit</button>
                <button class="btn btn-primary" id="claimItemBtn" style="background-color: var(--success);">Mark as Claimed</button>
                <button class="btn btn-primary" id="deleteItemBtn" style="background-color: var(--danger);">Delete</button>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeEditModal()">&times;</button>
            <h3 class="modal-title">Edit Item</h3>
            <form id="editItemForm">
                <div class="form-group">
                    <label class="form-label">Item Name</label>
                    <input type="text" class="form-control" id="editItemName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <input type="text" class="form-control" id="editCategory" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Color</label>
                    <input type="text" class="form-control" id="editColor" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" id="editLocation" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" id="editDate" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Image</label>
                    <div class="image-upload-container" id="imageUploadContainer" onclick="triggerFileInput()">
                        <p id="uploadText">Click to upload a new image</p>
                        <input type="file" id="imageFileInput" style="display: none" accept="image/*">
                        <img id="imagePreview" class="image-preview" style="display: none;">
                        <div class="upload-progress" id="uploadProgress">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>
                    <input type="hidden" id="editImageUrl">
                </div>
                <div class="form-group">
                    <label class="form-label">Contact Name</label>
                    <input type="text" class="form-control" id="editContactName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Contact Phone</label>
                    <input type="text" class="form-control" id="editContactPhone" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Contact Email</label>
                    <input type="email" class="form-control" id="editContactEmail" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove, update, push, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOZZ44tcqI8TPCXK6SzT7tURKM01j7efo",
            authDomain: "lostnfounditemlostdb.firebaseapp.com",
            databaseURL: "https://lostnfounditemlostdb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lostnfounditemlostdb",
            storageBucket: "lostnfounditemlostdb.appspot.com",
            messagingSenderId: "494153480103",
            appId: "1:494153480103:web:e04aef1eab4e89cdb5a882"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // Global variables
        let allItems = [];
        let searchSuggestions = [];
        let currentItem = null;

        // Function to format date
        function formatDate(dateString) {
            if (!dateString) return 'Unknown date';
            try {
                const options = { year: 'numeric', month: 'short', day: 'numeric' };
                return new Date(dateString).toLocaleDateString(undefined, options);
            } catch (e) {
                return 'Unknown date';
            }
        }

        // Function to show item modal
        function showItemModal(item) {
            currentItem = item;
            const modal = document.getElementById('itemModal');
            const modalTitle = document.getElementById('modalItemTitle');
            const modalImage = document.getElementById('modalItemImage');
            const modalDetails = document.getElementById('modalItemDetails');
            const contactName = document.getElementById('contactName');
            const contactPhone = document.getElementById('contactPhone');
            const contactEmail = document.getElementById('contactEmail');
            
            // Set modal content
            modalTitle.textContent = item.itemName || 'Item Details';
            
            if (item.imageUrl) {
                modalImage.src = item.imageUrl;
                modalImage.style.display = 'block';
            } else {
                modalImage.style.display = 'none';
            }

            // Set item details
            const date = item.dateLost || item.dateFound;
            const formattedDate = formatDate(date);
            
            let detailsHtml = `
                <div><strong>Type:</strong> ${item.type === 'lost' ? 'Lost' : 'Found'}</div>
                <div><strong>Date:</strong> ${formattedDate}</div>
                <div><strong>Category:</strong> ${item.category || 'Not specified'}</div>
                <div><strong>Color:</strong> ${item.primaryColor1 || 'Not specified'}</div>
                <div><strong>Location:</strong> ${item.location || 'Unknown'} ${item.additionalLocation ? `(${item.additionalLocation})` : ''}</div>
            `;
            
            modalDetails.innerHTML = detailsHtml;

            // Set contact info
            contactName.textContent = item.fullName || 'Not provided';
            contactPhone.textContent = item.phoneNumber || 'Not provided';
            contactEmail.textContent = item.email || 'Not provided';

            // Show modal
            modal.style.display = 'flex';

            // Update button visibility based on status
            document.getElementById('claimItemBtn').style.display = item.status === 'claimed' ? 'none' : 'block';
        }

        // Function to close modal
        function closeModal() {
            document.getElementById('itemModal').style.display = 'none';
            currentItem = null;
        }

        // Function to close edit modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('uploadProgress').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('uploadText').style.display = 'block';
        }

        // Function to show edit modal
        function showEditModal(item) {
            if (!item) item = currentItem;
            if (!item) return;
            
            currentItem = item;
            document.getElementById('editItemName').value = item.itemName || '';
            document.getElementById('editCategory').value = item.category || '';
            document.getElementById('editColor').value = item.primaryColor1 || '';
            document.getElementById('editLocation').value = item.location || '';
            document.getElementById('editContactName').value = item.fullName || '';
            document.getElementById('editContactPhone').value = item.phoneNumber || '';
            document.getElementById('editContactEmail').value = item.email || '';
            document.getElementById('editImageUrl').value = item.imageUrl || '';
            
            // Format date for the date input (YYYY-MM-DD)
            const itemDate = item.dateLost || item.dateFound;
            if (itemDate) {
                const dateObj = new Date(itemDate);
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                document.getElementById('editDate').value = `${year}-${month}-${day}`;
            } else {
                // Set default date to today if no date is available
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                document.getElementById('editDate').value = `${year}-${month}-${day}`;
            }
            
            // Show image preview if available
            const imagePreview = document.getElementById('imagePreview');
            const uploadText = document.getElementById('uploadText');
            
            if (item.imageUrl) {
                imagePreview.src = item.imageUrl;
                imagePreview.style.display = 'block';
                uploadText.style.display = 'none';
            } else {
                imagePreview.style.display = 'none';
                uploadText.style.display = 'block';
            }
            
            document.getElementById('editModal').style.display = 'flex';
        }

        // Function to trigger file input click
        function triggerFileInput() {
            document.getElementById('imageFileInput').click();
        }

        // Function to handle file selection
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Show preview immediately
            const reader = new FileReader();
            reader.onload = function(e) {
                const imagePreview = document.getElementById('imagePreview');
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            };
            reader.readAsDataURL(file);
            
            // Show loading overlay
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // Upload to ImgBB directly (more reliable than Firebase Storage for this use case)
            uploadToImgBB(file);
        }

        // Function to upload image to ImgBB
        async function uploadToImgBB(file) {
            const apiKey = '9b0dc76f6c3bb19d9effe36ecdc9ed87'; // ImgBB API key
            const formData = new FormData();
            formData.append('image', file);
            
            // Show progress bar
            const uploadProgress = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('progressBar');
            uploadProgress.style.display = 'block';
            progressBar.style.width = '0%';
            
            try {
                // Simulate upload progress
                let progress = 0;
                const progressInterval = setInterval(() => {
                    progress += 5;
                    if (progress > 90) clearInterval(progressInterval);
                    progressBar.style.width = `${progress}%`;
                }, 100);
                
                // Upload to ImgBB
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
                    method: 'POST',
                    body: formData
                });
                
                clearInterval(progressInterval);
                
                if (!response.ok) {
                    throw new Error('Failed to upload image to ImgBB');
                }
                
                const data = await response.json();
                
                // Complete progress bar
                progressBar.style.width = '100%';
                
                // Set image URL
                if (data.data && data.data.url) {
                    document.getElementById('editImageUrl').value = data.data.url;
                    console.log('Image uploaded successfully to ImgBB:', data.data.url);
                    
                    // Update the preview with the actual URL from ImgBB
                    const imagePreview = document.getElementById('imagePreview');
                    imagePreview.src = data.data.url;
                    imagePreview.style.display = 'block';
                    document.getElementById('uploadText').style.display = 'none';
                }
                
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
                
                return data.data.url;
            } catch (error) {
                console.error('Error uploading to ImgBB:', error);
                
                // Show error message
                alert('Failed to upload image. Please try again.');
                
                // Hide progress bar
                uploadProgress.style.display = 'none';
                
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
                
                return null;
            }
        }

        // Function to save edited item
        async function saveEditedItem(e) {
            e.preventDefault();
            
            if (!currentItem) return;
            
            // Show loading overlay
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            try {
                const updates = {
                    itemName: document.getElementById('editItemName').value,
                    category: document.getElementById('editCategory').value,
                    primaryColor1: document.getElementById('editColor').value,
                    location: document.getElementById('editLocation').value,
                    fullName: document.getElementById('editContactName').value,
                    phoneNumber: document.getElementById('editContactPhone').value,
                    email: document.getElementById('editContactEmail').value
                };

                // Update the appropriate date field based on item type
                const newDate = document.getElementById('editDate').value;
                if (newDate) {
                    if (currentItem.type === 'lost') {
                        updates.dateLost = new Date(newDate).toISOString();
                    } else {
                        updates.dateFound = new Date(newDate).toISOString();
                    }
                }

                // Only update image URL if a new one was provided
                const newImageUrl = document.getElementById('editImageUrl').value.trim();
                if (newImageUrl) {
                    updates.imageUrl = newImageUrl;
                }
                
                const itemRef = ref(db, `${currentItem.type}Items/${currentItem.id}`);
                await update(itemRef, updates);
                
                closeEditModal();
                closeModal();
                loadAllItems(); // Refresh the list
                alert('Item updated successfully!');
            } catch (error) {
                console.error('Error updating item:', error);
                alert('Failed to update item. Please try again.');
            } finally {
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // Function to delete item
        async function deleteItem() {
            if (!currentItem || !confirm('Are you sure you want to delete this item?')) return;
            
            // Show loading overlay
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            try {
                const itemRef = ref(db, `${currentItem.type}Items/${currentItem.id}`);
                await remove(itemRef);
                closeModal();
                loadAllItems(); // Refresh the list
                alert('Item deleted successfully!');
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Failed to delete item. Please try again.');
            } finally {
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // Function to mark item as claimed (moves to claimedItems and deletes from original)
        async function markAsClaimed() {
            if (!currentItem || !confirm('Mark this item as claimed and move to claimed items?')) return;
            
            // Show loading overlay
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            try {
                // 1. Get the complete item data
                const itemRef = ref(db, `${currentItem.type}Items/${currentItem.id}`);
                const snapshot = await get(itemRef);
                const itemData = snapshot.val();
                
                if (!itemData) {
                    throw new Error('Item not found');
                }
                
                // 2. Add to claimed items database
                const claimedRef = ref(db, 'claimedItems');
                const newClaimedRef = push(claimedRef);
                await set(newClaimedRef, {
                    ...itemData,
                    status: 'claimed',
                    dateClaimed: new Date().toISOString(),
                    originalType: currentItem.type
                });
                
                // 3. Remove from original location
                await remove(itemRef);
                
                closeModal();
                loadAllItems(); // Refresh the list
                alert('Item successfully moved to claimed items!');
            } catch (error) {
                console.error('Error claiming item:', error);
                alert('Failed to mark item as claimed. Please try again.');
            } finally {
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // Function to render items with admin controls
        function renderItems(items, containerId, type) {
            const container = document.getElementById(containerId);
            
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">No ' + type + ' items found</div>';
                document.getElementById(`${type}Count`).textContent = '0 items';
                return;
            }

            let html = '';
            items.forEach(item => {
                const date = item.dateLost || item.dateFound;
                const formattedDate = formatDate(date);
                
                html += `
                    <div class="newsfeed-item">
                        <div class="admin-controls">
                            <button class="admin-btn edit-btn" onclick="showEditModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">Edit</button>
                            <button class="admin-btn delete-btn" onclick="handleDeleteItem('${item.type}', '${item.id}')">Delete</button>
                            ${item.status !== 'claimed' ? 
                                `<button class="admin-btn claim-btn" onclick="handleClaimItem('${item.type}', '${item.id}')">Claim</button>` : ''}
                        </div>
                        <div class="newsfeed-header">
                            <span class="newsfeed-type ${type === 'lost' ? 'type-lost' : 'type-found'}">
                                ${type === 'lost' ? 'Lost' : 'Found'}
                            </span><span>${formattedDate}</span>
                            <span></span>
                        </div>
                        <h3 class="newsfeed-title">${item.itemName || 'Unnamed Item'}</h3>
                        <div class="newsfeed-details">
                            <span>${item.category || 'No category'}</span>
                            <span>•</span>
                            <span>${item.primaryColor1 || 'No color specified'}</span>
                        </div>
                        <div class="newsfeed-image-container" onclick="showItemModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                            ${item.imageUrl ? `
                                <img src="${item.imageUrl}" alt="${item.itemName}" class="newsfeed-image">
                            ` : `
                                <div class="no-image">No image available</div>
                            `}
                        </div>
                        <div class="newsfeed-location">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <span>${item.location || 'Unknown location'} ${item.additionalLocation ? `(${item.additionalLocation})` : ''}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById(`${type}Count`).textContent = `${items.length} items`;
        }

        // Function to load all items
        function loadAllItems() {
            const lostItemsRef = ref(db, 'lostItems');
            const foundItemsRef = ref(db, 'foundItems');

            onValue(lostItemsRef, (lostSnapshot) => {
                onValue(foundItemsRef, (foundSnapshot) => {
                    allItems = [];
                    const lostItems = [];
                    const foundItems = [];
                    
                    // Process lost items
                    if (lostSnapshot.exists()) {
                        lostSnapshot.forEach((childSnapshot) => {
                            const item = childSnapshot.val();
                            item.id = childSnapshot.key;
                            item.type = 'lost';
                            lostItems.push(item);
                            allItems.push(item);
                        });
                    }
                    
                    // Process found items
                    if (foundSnapshot.exists()) {
                        foundSnapshot.forEach((childSnapshot) => {
                            const item = childSnapshot.val();
                            item.id = childSnapshot.key;
                            item.type = 'found';
                            foundItems.push(item);
                            allItems.push(item);
                        });
                    }
                    
                    // Sort by timestamp (newest first)
                    lostItems.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
                    foundItems.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));

                    // Render items
                    renderItems(lostItems, 'lostItemsFeed', 'lost');
                    renderItems(foundItems, 'foundItemsFeed', 'found');

                    // Build search suggestions
                    buildSearchSuggestions();
                });
            });
        }

        // Function to build search suggestions
        function buildSearchSuggestions() {
            searchSuggestions = [];
            const itemNames = new Set();
            
            allItems.forEach(item => {
                if (item.itemName) {
                    itemNames.add(item.itemName.toLowerCase());
                }
            });
            
            searchSuggestions = Array.from(itemNames);
        }

        // Function to show search suggestions
        function showSuggestions(searchTerm) {
            const suggestionsContainer = document.getElementById('searchSuggestions');
            
            if (!searchTerm || searchTerm.length < 2) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            
            const filtered = searchSuggestions.filter(suggestion => 
                suggestion.includes(searchTerm.toLowerCase())
            ).slice(0, 5);
            
            if (filtered.length === 0) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            
            let html = '';
            filtered.forEach(suggestion => {
                html += `<div class="suggestion-item">${suggestion}</div>`;
            });
            
            suggestionsContainer.innerHTML = html;
            suggestionsContainer.style.display = 'block';
        }

        // Function to filter items by search term
        function filterItems(searchTerm) {
            if (!searchTerm || searchTerm.length < 2) {
                // Reset to show all items if search is empty
                loadAllItems();
                return;
            }
            
            const filteredLost = allItems.filter(item => 
                item.type === 'lost' && 
                item.itemName && 
                item.itemName.toLowerCase().includes(searchTerm.toLowerCase())
            );
            
            const filteredFound = allItems.filter(item => 
                item.type === 'found' && 
                item.itemName && 
                item.itemName.toLowerCase().includes(searchTerm.toLowerCase())
            );
            
            renderItems(filteredLost, 'lostItemsFeed', 'lost');
            renderItems(filteredFound, 'foundItemsFeed', 'found');
        }

        // Handle delete item
        async function handleDeleteItem(type, id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            
            // Show loading overlay
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            try {
                const itemRef = ref(db, `${type}Items/${id}`);
                await remove(itemRef);
                loadAllItems(); // Refresh the list
                alert('Item deleted successfully!');
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Failed to delete item. Please try again.');
            } finally {
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // Handle claim item (moves to claimedItems and deletes from original)
        async function handleClaimItem(type, id) {
            if (!confirm('Mark this item as claimed and move to claimed items?')) return;
            
            // Show loading overlay
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            try {
                // 1. Get the item first
                const itemRef = ref(db, `${type}Items/${id}`);
                const snapshot = await get(itemRef);
                const itemData = snapshot.val();
                
                if (!itemData) {
                    throw new Error('Item not found');
                }
                
                // 2. Add to claimed items
                const claimedRef = ref(db, 'claimedItems');
                const newClaimedRef = push(claimedRef);
                
                await set(newClaimedRef, {
                    ...itemData,
                    status: 'claimed',
                    dateClaimed: new Date().toISOString(),
                    originalType: type
                });
                
                // 3. Remove from original location
                await remove(itemRef);
                
                loadAllItems(); // Refresh the list
                alert('Item marked as claimed and moved to claimed items!');
            } catch (error) {
                console.error('Error claiming item:', error);
                alert('Failed to mark item as claimed. Please try again.');
            } finally {
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Load all items
            loadAllItems();
            
            // Search input event
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const searchTerm = e.target.value.trim();
                showSuggestions(searchTerm);
                filterItems(searchTerm);
            });

            // Search suggestions click
            document.getElementById('searchSuggestions').addEventListener('click', (e) => {
                if (e.target.classList.contains('suggestion-item')) {
                    const searchTerm = e.target.textContent;
                    document.getElementById('searchInput').value = searchTerm;
                    document.getElementById('searchSuggestions').style.display = 'none';
                    filterItems(searchTerm);
                }
            });

            // Hide suggestions when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container')) {
                    document.getElementById('searchSuggestions').style.display = 'none';
                }
            });

            // File input change
            document.getElementById('imageFileInput').addEventListener('change', handleFileSelect);
            
            // Form submission
            document.getElementById('editItemForm').addEventListener('submit', saveEditedItem);
            
            // Button event listeners
            document.getElementById('claimItemBtn').addEventListener('click', markAsClaimed);
            document.getElementById('deleteItemBtn').addEventListener('click', deleteItem);
            document.getElementById('editItemBtn').addEventListener('click', function() {
                showEditModal(currentItem);
            });

            // Close modals when clicking outside
            document.getElementById('itemModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('itemModal')) {
                    closeModal();
                }
            });

            document.getElementById('editModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('editModal')) {
                    closeEditModal();
                }
            });
        });

        // Make functions available globally
        window.showItemModal = showItemModal;
        window.showEditModal = showEditModal;
        window.closeModal = closeModal;
        window.closeEditModal = closeEditModal;
        window.handleDeleteItem = handleDeleteItem;
        window.handleClaimItem = handleClaimItem;
        window.triggerFileInput = triggerFileInput;
        window.logout = function() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
